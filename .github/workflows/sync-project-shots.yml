# Keeps the portfolio's project cards in step with what each project last
# photographed of itself. Every deployed repo refreshes its own
# project-media/ after each deployment (project-meta-refresh.yml there); this
# pulls those images and each project.meta.json here, syncs the catalogue data,
# and commits, which makes Cloudflare rebuild the site.
name: Sync project shots

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-project-shots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Pull each project's screenshots and metadata
    # Self-hosted (owner's decision, 2026-10-13): GitHub-hosted jobs are refused while the
    # account's Actions billing is suspended, so Linux jobs run on the owner's own ARM64 boxes
    # (the Kinhank and the tablet, Debian in proot, one runner per repo on each).
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull project-media and project.meta.json from every deployed repo
        env:
          # A token that can read the private repos (BBeats, VYB Chess); public
          # repos need none.
          PORTFOLIO_SYNC_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
        run: node scripts/meta/pull-project-media.mjs --mirror=.meta-mirror

      - name: Sync the catalogue data from the mirrored metadata
        env:
          PROJECT_META_MIRROR: .meta-mirror
        run: node scripts/meta/sync-project-meta.mjs --write

      - name: Commit what changed
        run: |
          git config user.name "project-meta bot"
          git config user.email "project-meta-bot@users.noreply.github.com"
          git add public/project-shots src/project-data.json src/project-details.json src/repo-analysis.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Sync project screenshots and metadata from the repos [meta-bot]"
          # Something else may have pushed while this run was working: a hand
          # edit to the site, or the previous hourly run finishing late. A bare
          # push then fails with "fetch first" and the whole sync is lost until
          # the next hour. Replay this commit on top of theirs instead. All four
          # staged paths are generated from the mirror, so where the two sides
          # disagree the freshly synced content is the correct one to keep.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected; replaying onto origin/master (attempt $attempt)"
            git fetch origin master
            git rebase -X theirs origin/master || { git rebase --abort; exit 1; }
          done
          echo "could not push after three attempts"
          exit 1
