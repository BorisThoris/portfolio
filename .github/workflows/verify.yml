name: Verify portfolio
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Self-hosted (owner's decision, 2026-10-13): GitHub-hosted jobs are refused while the
    # account's Actions billing is suspended, so Linux jobs run on the owner's own ARM64 boxes
    # (the Kinhank and the tablet, Debian in proot, one runner per repo on each).
    runs-on: [self-hosted, Linux]
    # 15 was too tight for this hardware and silently became the failure mode:
    # GitHub reports a job it cancels for timeout as "cancelled", not "failed",
    # so the runs just stopped going green with no error to read. Measured on
    # the self-hosted nodes: 4, 5, 9 and 14 minutes when it passed, then 15, 17
    # and 20 once two more projects joined the route sweep. 45 leaves real
    # headroom while still catching a run that has genuinely hung.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run build
      - run: npm run test:media
      # TEMPORARY (2026-10-24): the Android runners fail to launch a browser with
      # "env: .../chromium-browser: No such file or directory", while the same
      # wrapper runs Chromium fine in a fresh container session with identical
      # binds. This prints what the job itself sees. Remove once answered.
      - name: Diagnose the browser the job can actually reach
        if: always()
        continue-on-error: true
        run: |
          T=/data/data/com.termux/files
          P="${PLAYWRIGHT_BROWSERS_PATH:-/root/gha/ms-playwright}"
          echo "runner=$RUNNER_NAME browsers_path=$P"
          for f in "$T/usr/bin/chromium-browser" "$T/usr/bin/sh" "$T/usr/lib/chromium/chromium-launcher.sh" "$T/usr/lib/chromium/chrome" /opt/gha-fleet/termux-chrome; do
            e=N; x=N
            [ -e "$f" ] && e=y
            [ -x "$f" ] && x=y
            echo "PROBE exists=$e executable=$x $f"
          done
          echo "--- readlink chain ---"
          ls -l "$T/usr/bin/chromium-browser" || true
          echo "--- playwright shell ---"
          ls -l "$P"/chromium_headless_shell-*/chrome-headless-shell-linux-arm64/chrome-headless-shell || true
          echo "--- direct invocation ---"
          "$P"/chromium_headless_shell-*/chrome-headless-shell-linux-arm64/chrome-headless-shell --version || echo "direct invocation rc=$?"
          echo "--- identity ---"
          id || true
      - run: npm run check:ui
      - run: npm run check:native
      - run: npm run check:media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-verification
          path: output/playwright
          retention-days: 7
