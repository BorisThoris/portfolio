name: Verify portfolio
on:
  push:
    branches: [master, main]
  pull_request:
  # The hourly metadata sync commits with GITHUB_TOKEN, and GitHub does not
  # start workflows for those pushes, so the tip of master is often a bot
  # commit with no verification of its own. This makes any commit checkable
  # on demand: Actions -> Verify portfolio -> Run workflow.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Self-hosted (owner's decision, 2026-10-13): GitHub-hosted jobs are refused while the
    # account's Actions billing is suspended, so Linux jobs run on the owner's own ARM64 boxes
    # (the Kinhank and the tablet, Debian in proot, one runner per repo on each).
    # Pinned to the rt7 box. The fleet registers each runner with its device as a
    # custom label, so this selects the tablet and skips the Kinhank, whose proot
    # session takes signal 11 about 24 seconds into a job: the supervisor restarts
    # the runner, the new listener collides with the still-registered session
    # ("A session for this runner already exists"), and GitHub kills the orphaned
    # job at its lease expiry - always exactly 10m01s, with the step left
    # in_progress and no error to read. Verified 2026-10-25: four signal 11
    # warnings and nineteen non-portfolio runner exits in that box's supervisor
    # log, so it affects every repo there, not just this one. The Kinhank runs
    # proot 5.1.107.99; rt7, which has never failed a run, runs .100.
    # This costs the second runner as a fallback, which was only ever a coin flip
    # that wasted ten minutes and a re-run. Drop the "rt7" label from the list to
    # put the Kinhank back once its proot is upgraded.
    runs-on: [self-hosted, Linux, rt7]
    # 15 was too tight for this hardware and silently became the failure mode:
    # GitHub reports a job it cancels for timeout as "cancelled", not "failed",
    # so the runs just stopped going green with no error to read. Measured on
    # the self-hosted nodes: 4, 5, 9 and 14 minutes when it passed, then 15, 17
    # and 20 once two more projects joined the route sweep. 45 leaves real
    # headroom while still catching a run that has genuinely hung.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run build
      - run: npm run test:media
      - run: npm run check:ui
      - run: npm run check:native
      - run: npm run check:media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-verification
          path: output/playwright
          retention-days: 7
